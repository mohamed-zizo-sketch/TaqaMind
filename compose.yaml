services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Database name required}
      POSTGRES_USER: ${POSTGRES_USER:?Database user required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"

    command:
      - postgres
      - -c
      - hba_file=/etc/taqamind/postgres/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - authentication_timeout=10s
      - -c
      - max_connections=100
      - -c
      - log_statement=none
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_min_error_statement=panic
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_error_verbosity=terse

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/pg_hba.conf:/etc/taqamind/postgres/pg_hba.conf:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}"
          psql -h 127.0.0.1
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
          -w -Atqc "SELECT 1" > /dev/null
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
