        task_type: regression
        target_kind: quantity
        definition:
          definition: Total non-metallic waste mass (soil, water/moisture, and other
            debris) deducted upon unloading inspection of a scrap delivery.
          granularity: one_scrap_delivery_vehicle
          measurement_method: Sum of soil_kg + water_kg + other_kg logged at unloading.
          included_components:
