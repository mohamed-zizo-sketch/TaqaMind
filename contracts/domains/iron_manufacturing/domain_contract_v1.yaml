        - entrydate
        - entry_date
        - planned_start_ts
        - تاريخ الدخول
        source_system: Weighbridge System
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
