          - water_moisture_deduction
          - other_non_metallic_debris
          excluded_components:
          - recoverable_ferrous_scrap_mass
          - rejected_full_truck_returned_to_supplier
        confirmation:
          status: unconfirmed
          confirmed_by: null
          confirmed_at: null
          notes: Awaiting factory confirmation on whether Soil/Water/Other contaminant
            deductions are physically weighed or inspector-estimated and whether gross_delivery_mass_kg
            is recorded at entry weighbridge before unloading.
        derived_rate:
