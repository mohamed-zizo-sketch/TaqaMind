          numerator: total_contaminant_kg
          denominator: gross_delivery_mass_kg
          granularity: one_scrap_delivery_vehicle
          output_unit: '%'
          multiplier: 100.0
      prediction_context:
        prediction_stage: pre_production
        horizon_seconds: null
        description: Prediction executed at entry weighbridge before unloading inspection
          (t <= t0).
      business_keys:
