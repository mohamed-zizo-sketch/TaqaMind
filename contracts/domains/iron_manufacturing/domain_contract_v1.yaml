- process_id: scrap_yard_reception
  version: 1.0.0
  display_name: Scrap Yard Reception & Quality Inspection
  description: Incoming ferrous scrap weighbridge reception and non-metallic contaminant
    assessment prior to EAF charging.
  tasks:
  - task_id: scrap_delivery_contaminant_prediction
    version: 1.0.0
    display_name: Scrap Yard Pre-Inspection Contaminant Prediction
    description: Predict expected non-metallic contaminant mass (kg) in an incoming
      scrap delivery from supplier, scrap grade, delivery mass, transport mode, and
      arrival time.
    module: waste_management
    task_type: regression
    dataset_contract:
      dataset_id: scrap_yard_delivery_contaminant
      version: 1.0.0
      domain: iron_manufacturing
      process: scrap_yard_reception
      description: Pre-inspection scrap delivery dataset for non-metallic contaminant
        prediction.
      granularity: one_scrap_delivery_vehicle
      features:
      - name: scrap_delivery_id
        display_name: Scrap Delivery Ticket ID
        description: Unique business identifier for one incoming scrap vehicle delivery.
        data_type: string
        role: identifier
        availability: pre_production
        origin: recorded
        unit: null
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - delivery_id
        - ticket_id
        - weighbridge_id
        - رقم الشحنة
        - اذن الاستلام
        source_system: Weighbridge System
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: supplier_group_id
        display_name: Supplier Group Key
        description: Supplier identifier used for group-aware splitting and leakage
          control (prevents memorizing single-supplier bursts across train/test).
        data_type: string
        role: metadata
        availability: pre_production
        origin: recorded
        unit: null
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - vendor_group_id
        - supplier_batch_group
        source_system: ERP Procurement
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: entry_ts
        display_name: Weighbridge Entry Timestamp
        description: Timestamp when the scrap vehicle arrives at the entry weighbridge
          (t0).
        data_type: datetime
        role: timestamp
        availability: pre_production
        origin: recorded
        unit: null
        required: true
        nullable: false
        missing_policy: reject
