domain_id: iron_manufacturing
version: 1.0.0
display_name: Iron & Steel Manufacturing
description: Configurable industrial ML domain for Egyptian iron and steel facilities
  (EAF primary meltshop, rebar hot rolling mill, and scrap yard reception). Current
  executable ML scope is pre-production waste/scrap quantity prediction.
processes:
- process_id: eaf_meltshop
  version: 1.0.0
  display_name: Electric Arc Furnace (EAF) Primary Meltshop
  description: Primary steelmaking melting of scrap and Direct Reduced Iron (DRI/HBI)
    into liquid steel prior to secondary metallurgy and continuous casting.
  tasks:
  - task_id: eaf_metallic_waste_loss_prediction
    version: 1.0.0
    display_name: EAF Pre-Production Metallic Waste Prediction
    description: Predict expected metallic waste loss (metric tons) for an EAF heat
      using planned charge mix, DRI assays, recipe setpoints, and vessel age.
    module: waste_management
    task_type: regression
    dataset_contract:
      dataset_id: eaf_meltshop_heat_waste
      version: 1.0.0
      domain: iron_manufacturing
      process: eaf_meltshop
      description: Pre-production EAF primary meltshop heat dataset for metallic waste
        loss prediction.
      granularity: one_eaf_heat
      features:
      - name: heat_id
        display_name: Heat Identifier
        description: Unique business identifier for one EAF melting heat.
        data_type: string
        role: identifier
        availability: pre_production
        origin: recorded
        unit: null
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - heat_no
        - heat_number
        - melt_id
        - رقم الصبة
        - كود الصبة
        source_system: Level-2 MES
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: production_order_id
        display_name: Production Order Identifier
        description: Campaign or customer production order grouping sequential heats;
          used for group-aware leakage-free splitting.
        data_type: string
        role: metadata
        availability: pre_production
        origin: recorded
        unit: null
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - order_id
        - work_order_id
        - campaign_order_id
        - امر الشغل
        source_system: ERP
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: planned_start_ts
        display_name: Planned Heat Start Timestamp
        description: Scheduled heat start timestamp prior to scrap basket charging
          (t0).
        data_type: datetime
        role: timestamp
        availability: pre_production
        origin: recorded
        unit: null
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - start_time
        - heat_start_ts
        - تاريخ الصبة
        - وقت بداية الصبة
        source_system: MES Scheduler
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: furnace_id
        display_name: EAF Vessel Identifier
        description: Physical electric arc furnace vessel asset identifier.
        data_type: category
        role: predictor
        availability: static
        origin: configured
        unit: null
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - eaf_id
        - furnace_no
        - رقم الفرن
        source_system: MES Master Data
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: shift_code
        display_name: Planned Shift Code
        description: Scheduled plant operating shift for the heat.
        data_type: category
        role: predictor
        availability: pre_production
        origin: configured
        unit: null
        required: false
        nullable: true
        missing_policy: impute
        aliases:
        - shift
        - shift_name
        - الوردية
        source_system: MES Calendar
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values:
          - MORNING
          - EVENING
          - NIGHT
        derived_from: []
      - name: steel_grade_code
        display_name: Target Steel Grade
        description: Ordered steel metallurgy specification (e.g., B500DWR, B500B).
        data_type: category
        role: predictor
        availability: pre_production
        origin: recorded
        unit: null
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - steel_grade
        - grade_code
        - alloy_grade
        - رتبة الصلب
        source_system: ERP / Metallurgy
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: planned_scrap_mass_t
        display_name: Planned Scrap Charge Mass
        description: Planned total ferrous scrap mass loaded into charging baskets.
        data_type: float
        role: predictor
        availability: pre_production
        origin: recorded
        unit: metric_ton
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - scrap_mass_t
        - planned_scrap_tons
        - وزن الخردة المخطط
        source_system: Scrap Yard Scale / MES
        constraints:
          minimum: 0.0
          maximum: 300.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: planned_dri_mass_t
        display_name: Planned DRI / HBI Charge Mass
        description: Planned Direct Reduced Iron or HBI mass scheduled for the heat.
        data_type: float
        role: predictor
        availability: pre_production
        origin: recorded
        unit: metric_ton
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - dri_mass_t
        - planned_dri_tons
        - وزن الاختزال المباشر
        source_system: DRI Silo Plan / MES
        constraints:
          minimum: 0.0
          maximum: 300.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: planned_tap_mass_t
        display_name: Planned Tap Mass
        description: Target liquid steel tap weight ordered for the heat.
        data_type: float
        role: predictor
        availability: pre_production
        origin: recorded
        unit: metric_ton
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - target_tap_weight
        - planned_tap_tons
        - الوزن المستهدف للصبة
        source_system: MES Heat Plan
        constraints:
          minimum: 0.0
          maximum: 350.0
          minimum_inclusive: false
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: planned_scrap_grade_mix_code
        display_name: Planned Scrap Grade Mix
        description: Primary scrap grade classification for the scheduled charge.
        data_type: category
        role: predictor
        availability: pre_production
        origin: recorded
        unit: null
        required: false
        nullable: true
        missing_policy: impute
        aliases:
        - scrap_mix_code
        - scrap_class
        - تصنيف الخردة
        source_system: Scrap Yard Inventory
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: expected_scrap_contaminant_pct
        display_name: Expected Scrap Contaminant Share
        description: Pre-charge expected non-metallic dirt, moisture, and debris percentage
          based on yard inspection or historical causal supplier prior (<= t0).
        data_type: float
        role: predictor
        availability: pre_production
        origin: recorded
        unit: '%'
        required: false
        nullable: true
        missing_policy: impute
        aliases:
        - prior_scrap_dirt_pct
        - expected_dirt_pct
        - نسبة الشوائب المتوقعة
        source_system: Yard Inspection
        constraints:
          minimum: 0.0
          maximum: 25.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: dri_metallization_pct
        display_name: DRI Metallization Percentage
        description: Pre-charge LIMS assay ratio of metallic Fe to total Fe in DRI
          lot.
        data_type: float
        role: predictor
        availability: pre_production
        origin: measured
        unit: '%'
        required: false
        nullable: true
        missing_policy: impute
        aliases:
        - metallization_pct
        - dri_met_pct
        - نسبة التمعدن
        source_system: DRP LIMS
        constraints:
          minimum: 70.0
          maximum: 99.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: dri_gangue_pct
        display_name: DRI Acidic Gangue Percentage
        description: Pre-charge LIMS assay non-metallic oxide (SiO2 + Al2O3) share
          in DRI.
        data_type: float
        role: predictor
        availability: pre_production
        origin: measured
        unit: '%'
        required: false
        nullable: true
        missing_policy: impute
        aliases:
        - gangue_pct
        - شوائب الاختزال
        source_system: DRP LIMS
        constraints:
          minimum: 0.0
          maximum: 15.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: planned_hot_heel_mass_t
        display_name: Planned Hot Heel Mass
        description: Estimated liquid steel hot heel retained from the previous heat.
        data_type: float
        role: predictor
        availability: pre_production
        origin: recorded
        unit: metric_ton
        required: false
        nullable: true
        missing_policy: impute
        aliases:
        - hot_heel_t
        - رصيد البوتقة الساخن
        source_system: Meltshop Log
        constraints:
          minimum: 0.0
          maximum: 40.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: planned_lime_flux_kg
        display_name: Planned Lime and Dolomite Flux
        description: Planned CaO / dolomite flux mass in the Level-2 melting recipe.
        data_type: float
        role: predictor
        availability: pre_production
        origin: configured
        unit: kg
        required: false
        nullable: true
        missing_policy: impute
        aliases:
        - lime_kg
        - flux_kg
        - كمية الجير المخططة
        source_system: Level-2 Recipe
        constraints:
          minimum: 0.0
          maximum: 20000.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: planned_oxygen_nm3
        display_name: Planned Oxygen Injection Volume
        description: Planned oxygen lance and burner volume in the Level-2 melting
          recipe.
        data_type: float
        role: predictor
        availability: pre_production
        origin: configured
        unit: Nm3
        required: false
        nullable: true
        missing_policy: impute
        aliases:
        - oxygen_plan_nm3
        - كمية الاكسجين المخططة
        source_system: Level-2 Recipe
        constraints:
          minimum: 0.0
          maximum: 15000.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: target_tap_temp_c
        display_name: Target Tapping Temperature
        description: Ordered liquid steel tapping temperature specification.
        data_type: float
        role: predictor
        availability: pre_production
        origin: configured
        unit: degC
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - aim_tap_temp
        - حرارة الصب المستهدفة
        source_system: Metallurgy Spec
        constraints:
          minimum: 1520.0
          maximum: 1720.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: refractory_lining_heat_age
        display_name: Refractory Lining Age (Heats)
        description: Number of completed heats since the last EAF refractory relining.
        data_type: integer
        role: predictor
        availability: pre_production
        origin: recorded
        unit: heats
        required: false
        nullable: true
        missing_policy: impute
        aliases:
        - lining_age
        - furnace_campaign_heat
        - عمر التبطين الحراري
        source_system: Maintenance Log
        constraints:
          minimum: 0.0
          maximum: 5000.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: planned_total_metallic_charge_t
        display_name: Planned Total Metallic Charge
        description: Deterministic sum of planned_scrap_mass_t and planned_dri_mass_t.
        data_type: float
        role: predictor
        availability: pre_production
        origin: derived
        unit: metric_ton
        required: true
        nullable: false
        missing_policy: reject
        aliases: []
        source_system: null
        constraints:
          minimum: 0.0
          maximum: 500.0
          minimum_inclusive: false
          maximum_inclusive: true
          allowed_values: null
        derived_from:
        - planned_scrap_mass_t
        - planned_dri_mass_t
      - name: planned_dri_share_pct
        display_name: Planned DRI Charge Share
        description: Percentage of planned metallic charge supplied by DRI/HBI.
        data_type: float
        role: predictor
        availability: pre_production
        origin: derived
        unit: '%'
        required: false
        nullable: true
        missing_policy: impute
        aliases: []
        source_system: null
        constraints:
          minimum: 0.0
          maximum: 100.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from:
        - planned_dri_mass_t
        - planned_total_metallic_charge_t
      - name: planned_charge_to_tap_ratio
        display_name: Planned Charge-to-Tap Ratio
        description: Ratio of planned total metallic charge to planned liquid tap
          mass.
        data_type: float
        role: predictor
        availability: pre_production
        origin: derived
        unit: ratio
        required: false
        nullable: true
        missing_policy: impute
        aliases: []
        source_system: null
        constraints:
          minimum: 0.5
          maximum: 2.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from:
        - planned_total_metallic_charge_t
        - planned_tap_mass_t
      - name: planned_flux_kg_per_t_charge
        display_name: Planned Flux Intensity
        description: Planned lime/dolomite flux per metric ton of planned metallic
          charge.
        data_type: float
        role: predictor
        availability: pre_production
        origin: derived
        unit: kg/t
        required: false
        nullable: true
        missing_policy: impute
        aliases: []
        source_system: null
        constraints:
          minimum: 0.0
          maximum: 500.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from:
        - planned_lime_flux_kg
        - planned_total_metallic_charge_t
      - name: planned_oxygen_nm3_per_t_charge
        display_name: Planned Oxygen Intensity
        description: Planned oxygen volume per metric ton of planned metallic charge.
        data_type: float
        role: predictor
        availability: pre_production
        origin: derived
        unit: Nm3/t
        required: false
        nullable: true
        missing_policy: impute
        aliases: []
        source_system: null
        constraints:
          minimum: 0.0
          maximum: 200.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from:
        - planned_oxygen_nm3
        - planned_total_metallic_charge_t
      - name: planned_expected_dirt_mass_t
        display_name: Planned Expected Scrap Dirt Mass
        description: Expected non-metallic mass from scrap dirt/moisture before charging.
        data_type: float
        role: predictor
        availability: pre_production
        origin: derived
        unit: metric_ton
        required: false
        nullable: true
        missing_policy: impute
        aliases: []
        source_system: null
        constraints:
          minimum: 0.0
          maximum: 100.0
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from:
        - planned_scrap_mass_t
        - expected_scrap_contaminant_pct
      target:
        target_id: eaf_metallic_waste_loss
        version: 1.0.0
        feature:
          name: metallic_waste_loss_t
          display_name: Metallic Waste Loss
          description: Measured metallic mass lost during EAF melting (FeO oxidation
            to slag, EAF baghouse dust, and non-recoverable metallic loss) per heat.
          data_type: float
          role: target
          availability: post_production
          origin: measured
          unit: metric_ton
          required: true
          nullable: false
          missing_policy: reject
          aliases:
          - meltshop_waste_t
          - yield_loss_t
          - فاقد الصهر
          - الهالك المعدني
          source_system: Post-Tap Weighbridges
          constraints:
            minimum: 0.0
            maximum: 100.0
            minimum_inclusive: true
            maximum_inclusive: true
            allowed_values: null
          derived_from: []
        task_type: regression
        target_kind: quantity
        definition:
          definition: Net non-recovered metallic mass loss per EAF heat, reconciled
            from calibrated charge weighbridges and post-tap liquid steel ladle crane
            scale.
          granularity: one_eaf_heat
          measurement_method: Post-tap mass balance (actual_total_metallic_charge_t
            - actual_liquid_steel_tapped_t) after excluding credited recovered skulls.
          included_components:
          - slag_iron_oxide_loss
          - eaf_baghouse_dust_loss
          - non_recoverable_splash_loss
          - scrap_non_metallic_contaminants
          excluded_components:
          - returned_scrap_inventory
          - credited_reusable_ladle_skull
          - hot_heel_retained_in_vessel
        confirmation:
          status: unconfirmed
          confirmed_by: null
          confirmed_at: null
          notes: Awaiting Egyptian factory sign-off on hot-heel estimation, ladle-skull
            crediting, and weighbridge calibration semantics.
        derived_rate:
          name: metallic_waste_rate_pct
          numerator: metallic_waste_loss_t
          denominator: planned_total_metallic_charge_t
          granularity: one_eaf_heat
          output_unit: '%'
          multiplier: 100.0
      prediction_context:
        prediction_stage: pre_production
        horizon_seconds: null
        description: Prediction executed before scrap basket charging and DRI feeding
          (t <= t0).
      business_keys:
      - heat_id
      grouping_columns:
      - production_order_id
      time_column: planned_start_ts
- process_id: rebar_hot_rolling
  version: 1.0.0
  display_name: Rebar Hot Rolling Mill
  description: Hot rolling of continuous-cast steel billets through reheating furnace,
    roughing/intermediate/slitting stands, and cooling bed into finished rebar.
