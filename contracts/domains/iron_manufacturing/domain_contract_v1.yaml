      target:
        target_id: scrap_delivery_total_contaminant
        version: 1.0.0
        feature:
          name: total_contaminant_kg
          display_name: Total Non-Metallic Contaminant Mass
          description: Measured or deducted non-metallic contaminant mass (Soil +
            Water + Other) for one scrap delivery in kilograms.
          data_type: float
          role: target
          availability: post_production
          origin: measured
          unit: kg
          required: true
          nullable: false
          missing_policy: reject
          aliases:
