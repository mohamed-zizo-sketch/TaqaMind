  - task_id: rebar_rolling_waste_quantity_prediction
    version: 1.0.0
    display_name: Rebar Hot Rolling Pre-Production Waste Prediction
    description: Predict expected total rolling waste quantity (kg) for a billet rolling
      lot from diameter, slitting strands, billet mass, charging mode, and roll groove
      age.
    module: waste_management
    task_type: regression
    dataset_contract:
      dataset_id: rebar_rolling_lot_waste
      version: 1.0.0
      domain: iron_manufacturing
      process: rebar_hot_rolling
      description: Pre-production rebar hot rolling lot dataset for total rolling
        waste prediction.
      granularity: one_rolling_campaign_lot
      features:
      - name: rolling_lot_id
        display_name: Rolling Lot Identifier
        description: Unique business identifier for one billet-to-rebar rolling campaign
          lot.
        data_type: string
        role: identifier
        availability: pre_production
        origin: recorded
        unit: null
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - lot_id
        - campaign_id
        - rolling_batch_id
        - رقم التشغيلة
        - رقم اللوط
        source_system: Rolling MES
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: production_order_id
        display_name: Production Order Identifier
        description: Customer or campaign ERP order grouping multiple rolling lots.
        data_type: string
        role: metadata
        availability: pre_production
        origin: recorded
        unit: null
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - order_id
        - work_order_id
        - امر الشغل
        source_system: ERP
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: planned_start_ts
        display_name: Planned Lot Start Timestamp
        description: Scheduled timestamp when billet lot enters the reheating furnace
          (t0).
        data_type: datetime
        role: timestamp
        availability: pre_production
        origin: recorded
        unit: null
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - start_time
        - lot_date
        - تاريخ التشغيل
        source_system: Rolling MES
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: mill_line_id
        display_name: Rolling Mill Line Identifier
        description: Physical hot rolling mill line asset identifier.
        data_type: category
        role: predictor
        availability: static
        origin: configured
        unit: null
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - mill_id
        - line_id
        - خط الدرفلة
        source_system: MES Master Data
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: steel_grade_code
        display_name: Billet Steel Grade
        description: Steel grade specification of the charged billets (e.g., B500DWR).
        data_type: category
        role: predictor
        availability: pre_production
        origin: recorded
        unit: null
        required: true
        nullable: false
        missing_policy: reject
        aliases:
        - steel_grade
        - grade_code
        - رتبة الصلب
        source_system: ERP / Metallurgy
        constraints:
          minimum: null
          maximum: null
          minimum_inclusive: true
          maximum_inclusive: true
          allowed_values: null
        derived_from: []
      - name: rebar_diameter_mm
        display_name: Target Rebar Diameter
        description: Ordered finished rebar nominal diameter (mm).
        data_type: float
        role: predictor
        availability: pre_production
