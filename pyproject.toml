[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taqamind"
version = "0.1.0"
description = "Configurable Industrial Data and Machine Learning Pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2.3,<3",
    "pydantic>=2.10,<3",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]

ml = [
    "scikit-learn>=1.6,<2",
    "xgboost>=3.0,<4",
    "joblib>=1.4,<2",
]

research = [
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<1",
    "openpyxl>=3.1.5,<4",
]

dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]